name: Release

# Build a standalone CoCert binary per-OS on tag push, so a studio can run it on
# a test machine with no Python installed. Unix binaries only for now: the MVP
# suspend/resume path uses SIGSTOP/SIGCONT (no Windows until the psutil adapter).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cocert-linux-x86_64
          - os: macos-latest
            asset: cocert-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Verify tests before packaging
        run: python -m unittest discover -s tests

      - name: Build single-file binary
        # Bundle the toy fixture so `cocert demo` works from the binary too.
        run: |
          pyinstaller --onefile --name "${{ matrix.asset }}" \
            --add-data "cocert/_fixtures/faultygame.py:cocert/_fixtures" \
            -p . \
            packaging/entry.py

      - name: Smoke-test the binary
        run: ./dist/${{ matrix.asset }} demo --mode clean

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
